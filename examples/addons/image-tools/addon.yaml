id: image-tools
name: $AddonName
description: $AddonDescription
version: 1.0.0
author: BonitoCat
icon: icon.svg
script: scripts/image.sh

dependencies:
  - command: convert
    apt: imagemagick
    dnf: ImageMagick
    pacman: imagemagick
    zypper: ImageMagick

settings:
  - id: format
    title: $SettingFormat
    type: choice
    choices: [webp, png, jpg, gif]
    default: webp

  - id: quality
    title: $SettingQuality
    description: $SettingQualityHint
    type: number
    default: 85
    min: 1
    max: 100

  - id: max_size
    title: $SettingMaxSize
    type: number
    default: 1920
    min: 16
    max: 20000

actions:
  - id: image
    title: $AddonName
    icon: icon.svg
    location: context-menu
    after: compress
    targets: [file]
    extensions: [.png, .jpg, .jpeg, .webp, .gif, .bmp, .tif, .tiff, .avif, .heic, .svg, .ico]

  - id: convert
    title: $Convert
    parent: image
    extensions: [.png, .jpg, .jpeg, .webp, .gif, .bmp, .tif, .tiff, .avif, .heic]

  - id: resize
    title: $Resize
    parent: image
    extensions: [.png, .jpg, .jpeg, .webp, .gif, .bmp, .tif, .tiff, .avif, .heic]

  - id: strip
    title: $Strip
    parent: image
    extensions: [.png, .jpg, .jpeg, .webp, .tif, .tiff, .avif, .heic]
    confirm: $StripConfirm

  - id: info
    title: $Info
    parent: image
    multiple: false
    separator: before
